name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_USERNAME}" ] || [ -z "${SERVER_HOST}" ] || [ -z "${SERVER_PORT}" ] || [ -z "${SERVER_PASSWORD}" ]; then
            echo "Required secrets are missing (SERVER_USERNAME/HOST/PORT/PASSWORD)"
            exit 1
          fi

          if [ ! -d "www" ]; then
            echo "Local path not found: www/"
            exit 1
          fi

          # 카페24 등 — 로컬 접속과 동일하게 FTP(패시브) 사용
          # 로컬 www/ → 원격 /www/
          # data/, .well-known/, DBConnect/ 은 동기화·삭제 제외
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          open -u "${SERVER_USERNAME}","${SERVER_PASSWORD}" -p ${SERVER_PORT} ftp://${SERVER_HOST}
          mirror -R --delete --verbose --exclude-glob data/** --exclude-glob .well-known/** --exclude-glob DBConnect/** ./www/ /www/
          bye
          EOF
