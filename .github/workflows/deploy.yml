name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via WinSCP
        shell: powershell
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $winscp = "C:\Program Files (x86)\WinSCP\WinSCP.com"
          $localPath = "$pwd\www\" # 로컬 경로
          $remotePath = "/www/" # 원격 서버 경로

          $passEscaped = $env:SERVER_PASSWORD -replace '"', '""'
          $openLine = "open sftp://$($env:SERVER_USERNAME)@$($env:SERVER_HOST):$($env:SERVER_PORT)/ -hostkey=* -password=`"$passEscaped`""

          $scriptLines = @(
            $openLine
            "option batch abort"
            "option confirm off"
            "option transfer binary"
            # 원격 /www/data, /www/.well-known 은 동기화·삭제 제외
            "synchronize remote -criteria=time,size -delete -filemask=`"*;|data/;.well-known/`" ""$localPath"" ""$remotePath"""
            "exit"
          )

          $scriptPath = Join-Path $pwd "deploy_script.txt"
          $scriptLines -join "`r`n" | Out-File -FilePath $scriptPath -Encoding utf8

          if (-not (Test-Path $winscp)) { throw "WinSCP not found at: $winscp" }
          if (-not (Test-Path $localPath)) { throw "Local path not found: $localPath" }

          & $winscp /ini=nul /script="$scriptPath"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "WinSCP failed with exit code: $exitCode" }

          if (Test-Path $scriptPath) { Remove-Item $scriptPath -Force }
